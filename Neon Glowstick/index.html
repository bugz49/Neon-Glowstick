<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="glowstick.css">
        <title>GlowStick</title>
    </head>

    <body>
        <h1 class="heading">Neon GlowStick</h1>
        <main class="container">
            <div class="bulb">
                <div class="glare"></div>
            </div>

            <section class="holder">
                <div class="dial">
                    <button id="powerBtn"></button>

                    <div class="leds">
                        <div class="led1"></div>
                        <div class="led2"></div>
                    </div>
                </div>
            </section>
        </main>

        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="glowstick.js"></script>
    </body>
</html>
